services:
  - type: web
    name: vitasync-emergency-blood-redistribution
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_DEMO_MODE
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: vitasync-sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
